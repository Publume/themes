version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /themes/editorial
    schedule:
      interval: weekly
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
